name: Deploy now
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA or branch to deploy
        required: true
        type: string
      environment:
        description: Deployment environment
        type: choice
        options:
          - production
          - staging
        default: production
permissions:
  contents: read
concurrency:
  group: deploy-now-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Cache Bun install cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run copy-editor
      - run: bun run build:login
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$DEPLOY_ENVIRONMENT" == staging ]]; then
            args+=(--env staging)
          fi
          bunx wrangler deploy "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/deploy-now.log"
      - name: Summarize deployment
        shell: bash
        run: |
          set -euo pipefail
          version_line=$(grep -E 'Current Version ID:' "$RUNNER_TEMP/deploy-now.log")
          {
            echo '### Deployed Worker'
            printf 'Commit: `%s`\n\n' "$(git rev-parse HEAD)"
            printf '%s\n' "$version_line"
          } >> "$GITHUB_STEP_SUMMARY"
