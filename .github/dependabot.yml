version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      # Satori is a pinned yesid.design peer; update only when adopting a yesid.design release.
      - dependency-name: satori
      # Svelte is a pinned yesid.design peer; update only when adopting a yesid.design release.
      - dependency-name: svelte
      # TypeScript 7 needs a separate tsgo setup and a planned major-upgrade PR.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      # Sveltia upgrades stay deliberate: its own PR, checked against the pinned session contract in the README.
      sveltia:
        patterns: ["@sveltia/*"]
      dependencies:
        patterns: ["*"]
        exclude-patterns: ["@sveltia/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
